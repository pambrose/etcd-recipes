\* Liveness: without timeouts, every parked waiter is admitted and every client finishes,
\* despite a lease expiry and a failed revoke
SPECIFICATION Spec
CONSTANTS
  Prog <- LivenessProg
  MaxExpiries = 1
  MaxTimeouts = 0
  MaxRevokeFailures = 1
INVARIANTS
  TypeOK
  MutualExclusion
  FifoOrder
  InheritedRankIsBacked
PROPERTIES
  WaitersAdmitted
  AllFinish
CHECK_DEADLOCK FALSE
