name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the jobs only read the repo (Codecov uploads with its own token).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull requests compile and lint only: the Testcontainers suite takes 30+ minutes on a
# hosted runner, so it is run locally (make tests-tc) before a PR merges. Pushes to
# master still run the full suite and upload coverage, as a check after the merge.
# The TLA+ models (specs/) take seconds, so they run on every pull request and push.
jobs:
  tla:
    name: TLA+ models
    runs-on: ubuntu-latest
    # About 80 s of model checking on 18 cores; a 2-core runner takes several minutes
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Model-check the specs with TLC
        run: ./specs/tlc.sh

  test:
    name: build & test
    runs-on: ubuntu-latest
    # The Testcontainers suite has been running 23-26 min on a 2-core runner for
    # a while, so 30 left only a few minutes of headroom and any small addition
    # tipped it over: the job would be killed after every test had already passed.
    # This is a slow suite by nature (forkEvery=1, a container per fault-injection
    # class), so give it real headroom rather than shaving the margin again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        # v6's caching is a proprietary component under Gradle's Terms of Use
        # (https://gradle.com/legal/terms-of-use/), accepted by using it.
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Detekt
        run: ./gradlew detekt

      - name: Compile + lint + API check (pull requests)
        # Every main and test source set, including the website's snippet sources, and
        # the published modules' public API against their api/ reference dumps
        if: github.event_name == 'pull_request'
        run: ./gradlew classes testClasses lintKotlin checkKotlinAbi

      - name: Test + Kover XML (Testcontainers)
        if: github.event_name != 'pull_request'
        # Run check + koverXmlReport in one Gradle invocation so the test
        # task's inputs (notably -PuseTestcontainers) match between the
        # two; running them separately invalidates the test cache and
        # re-runs the suite without testcontainers wiring, which then
        # hangs trying to reach localhost:2379. -PskipLincheck leaves out the
        # CPU-heavy Lincheck model checks, which run locally (make tests-tc).
        run: ./gradlew check koverXmlReport -PuseTestcontainers -PskipLincheck

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # Use the library subproject's report directly. The root aggregate
          # at build/reports/kover/report.xml is empty because the root
          # project has no Kotlin source for Kover 0.9's aggregation to
          # attach to; the per-subproject report has the real data.
          files: ./etcd-recipes-core/build/reports/kover/report.xml
          # Do NOT let the action auto-discover reports. Search picks up the
          # empty root aggregate plus the examples/test-runners reports (no
          # main source / no tests), which report 0% and, when the named file
          # is missing after a failed run, get uploaded *instead* of it —
          # resetting the branch's coverage to 0%.
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
