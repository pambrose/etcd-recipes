\* Safety: two consumers, each its own instance, two items, one lease lapse or early
\* re-grant, one lost response, and one cancelled receive that unclaims
SPECIFICATION Spec
CONSTANTS
  Consumers = {c1, c2}
  NumItems = 2
  MaxAttempts = 2
  MaxExpiries = 1
  MaxLost = 1
  MaxUnclaims = 1
  SharedInstance = FALSE
  None = None
INVARIANTS
  TypeOK
  NoItemLost
  ClaimMarkerHasPayload
  AckedOnlyUnderOwnLiveClaim
  LiveClaimHasOneHolder
  NoStrandedClaim
  AttemptsCountDeliveries
  NoDeliveryPastMaxAttempts
  DeadLetteredOnlyAfterMaxAttempts
PROPERTIES
  NoTwoLiveClaims
  ClaimEndsOnlyByOwnerOrLapse
SYMMETRY Symm
CHECK_DEADLOCK FALSE
