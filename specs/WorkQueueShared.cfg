\* Two worker threads sharing one DistributedWorkQueue: one clientId, one lease, one
\* unresolvedClaims. Two lost responses, so one thread's lost claim can race the other's
\* claim (reconciled by the nonce) and an unresolved claim is released. One lease lapse or
\* early re-grant, and one cancelled receive. Safety and liveness, with one item.
SPECIFICATION Spec
CONSTANTS
  Consumers = {c1, c2}
  NumItems = 1
  MaxAttempts = 2
  MaxExpiries = 1
  MaxLost = 2
  MaxUnclaims = 1
  SharedInstance = TRUE
  None = None
INVARIANTS
  TypeOK
  NoItemLost
  ClaimMarkerHasPayload
  AckedOnlyUnderOwnLiveClaim
  LiveClaimHasOneHolder
  NoStrandedClaim
  AttemptsCountDeliveries
  NoDeliveryPastMaxAttempts
  DeadLetteredOnlyAfterMaxAttempts
PROPERTIES
  NoTwoLiveClaims
  ClaimEndsOnlyByOwnerOrLapse
  EveryItemFinishes
CHECK_DEADLOCK FALSE
