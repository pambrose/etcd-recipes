\* Safety and liveness with two lost responses: a claim whose response is lost and whose
\* re-read fails too is recorded as unresolved, and the sweeper releases it. One lease
\* lapse or early re-grant. One item keeps liveness fast; symmetry would be unsound.
SPECIFICATION Spec
CONSTANTS
  Consumers = {c1, c2}
  NumItems = 1
  MaxAttempts = 2
  MaxExpiries = 1
  MaxLost = 2
  MaxUnclaims = 0
  SharedInstance = FALSE
  None = None
INVARIANTS
  TypeOK
  NoItemLost
  ClaimMarkerHasPayload
  AckedOnlyUnderOwnLiveClaim
  LiveClaimHasOneHolder
  NoStrandedClaim
  AttemptsCountDeliveries
  NoDeliveryPastMaxAttempts
  DeadLetteredOnlyAfterMaxAttempts
PROPERTIES
  NoTwoLiveClaims
  ClaimEndsOnlyByOwnerOrLapse
  EveryItemFinishes
CHECK_DEADLOCK FALSE
