name: Cleanup

on:
  schedule:
    # Mondays 04:17 UTC: off the top of the hour, when scheduled runs are most often delayed
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the runs that would be deleted, without deleting them
        type: boolean
        default: true

# Least privilege: nothing at the workflow level; the job gets only actions: write.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Prunes the Actions run list. GitHub deletes a run's logs after 30 days (this repo's
# artifact and log retention, under Settings > Actions > General) but keeps the run itself in
# the list forever, so this deletes the runs then too. Artifacts expire on their own (ci.yml
# keeps test reports 7 days), and GitHub evicts caches itself.
# Note that each step also deletes every run whose workflow no longer exists, whatever its
# age (the action's "orphan runs"), so renaming or removing a workflow file drops its history.
#
# Each pass is retried once, a minute later: the action doesn't retry a GitHub API error
# itself, and a transient one (a 502 listing the runs) shouldn't fail the week. Both passes
# are idempotent, so a retry just finishes what the first attempt started.
jobs:
  cleanup:
    name: Delete old workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # to delete workflow runs
    steps:
      - name: Delete cancelled and skipped runs older than a week
        id: noise
        # A CI run superseded by a newer push, or a docs build skipped because CI didn't
        # pass, records nothing worth keeping
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: cancelled,skipped
          dry_run: ${{ inputs.dry_run || false }}

      - name: Delete runs older than 30 days, keeping each workflow's newest 10 of those
        id: age
        # keep_minimum_runs counts only runs past retain_days, so a workflow that rarely
        # runs still shows its last 10 runs however old they are
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 30
          keep_minimum_runs: 10
          dry_run: ${{ inputs.dry_run || false }}

      - name: Wait before retrying
        if: steps.noise.outcome == 'failure' || steps.age.outcome == 'failure'
        run: sleep 60

      - name: Retry deleting cancelled and skipped runs
        if: steps.noise.outcome == 'failure'
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 7
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: cancelled,skipped
          dry_run: ${{ inputs.dry_run || false }}

      - name: Retry deleting runs older than 30 days
        if: steps.age.outcome == 'failure'
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 30
          keep_minimum_runs: 10
          dry_run: ${{ inputs.dry_run || false }}
