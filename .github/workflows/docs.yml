name: Documentation

on:
  # Deploy only what CI passed: a push to master runs CI (which compiles every snippet
  # source set and runs the full suite), and CI's success on that push runs this. A
  # site whose snippets no longer compile never deploys.
  # zizmor flags every workflow_run (dangerous-triggers): it runs with this repo's
  # token even when a fork's PR fired the CI run. The build job's `if` admits only a
  # CI run triggered by a push, and CI runs on pushes to master alone, so fork code
  # never gets here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Build (but don't deploy) on PRs. The docs embed code snippets from the Gradle
  # test source sets via pymdownx.snippets with check_paths = true, so this job
  # catches a doc that points at a snippet section someone renamed or deleted.
  pull_request:
  workflow_dispatch:

# Least privilege by default: the build job only reads the repo. The Pages
# permissions are granted to the deploy job alone, so a PR build — which may run
# code from a fork — never holds a token that can publish.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A CI run that failed or was cancelled, or wasn't a push, builds and deploys nothing
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # zensical MUST run with the config directory as the working directory:
        # pymdownx.snippets resolves base_path against the process CWD, not against
        # the location of zensical.toml. Building from the repo root with
        # `-f website/etcd-recipes/zensical.toml` silently finds no snippets.
        working-directory: website/etcd-recipes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI verified, not whatever master has moved on to since
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # NOTE: deliberately no actions/configure-pages here. It exists to enable
      # Pages and to expose base_url/origin outputs for generators that need
      # them; zensical.toml sets site_url explicitly, so we use neither. Having
      # it in this job made every PR call the Pages API — which fails outright
      # for fork PRs, whose token is read-only. Only the deploy job touches Pages.

      # uv resolves zensical from website/uv.lock, so CI builds the docs with the
      # same pinned version as a local `make site`.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Build site
        # --strict promotes warnings (a nav entry with no page, a broken internal
        # link) into build failures.
        run: uv run zensical build --clean --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/etcd-recipes/site

  deploy:
    # Only master deploys (after CI passed there, or when run by hand); PRs stop after
    # the build job above.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
